<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midia da Unidade</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #dbe7f3;
      background: radial-gradient(circle at top, rgba(34, 76, 120, 0.45), rgba(0, 0, 0, 0.92));
      letter-spacing: 0.02em;
      font-size: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <video id="player" autoplay muted loop playsinline preload="auto"></video>
  <div id="message" class="message hidden"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src") || "";
    const video = document.getElementById("player");
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
      message.classList.remove("hidden");
    }

    function hideMessage() {
      message.classList.add("hidden");
      message.textContent = "";
    }

    if (!src) {
      showMessage("Nenhum video foi configurado para esta unidade.");
    } else {
      video.src = src;
      video.load();
      hideMessage();
      const playPromise = video.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
          showMessage("Nao foi possivel iniciar o video automaticamente.");
        });
      }
    }

    video.addEventListener("playing", hideMessage);
    video.addEventListener("error", () => {
      showMessage("Falha ao reproduzir o video configurado.");
    });
  </script>
</body>
</html>
